<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project X</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Экраны (страницы) -->
    <div id="tab-home" class="screen active">
      <header class="header">
        <div class="logo">BAZA</div>
        <div class="icons">
          <span class="badge" id="home-fav-badge">0</span> ❤️
        </div>
      </header>
      
      <div class="search-bar">
        <input type="text" placeholder="Поиск">
      </div>

      <!-- Важный баннер -->
      <div class="banner">
        <h3>ВАЖНО!</h3>
        <p>BAZA — это платформа доступа к поставщикам.</p>
      </div>

      <!-- Сетка категорий -->
      <div class="grid-categories" id="home-categories">
        <!-- JS отрисует сюда -->
      </div>
    </div>

    <div id="tab-favorites" class="screen">
      <header class="header"><h2>Избранное</h2></header>
      <div class="empty-state">В избранном пока пусто</div>
    </div>

    <div id="tab-profile" class="screen">
      <header class="header"><h2>Профиль</h2></header>
      <!-- Профиль сделаем позже -->
    </div>
  </div>

  <!-- Нижняя навигация (3 вкладки) -->
  <nav class="tab-bar">
    <div class="tab-item" data-tab="home">
      <svg>...</svg> <span>Главная</span>
    </div>
    <div class="tab-item" data-tab="favorites">
      <svg>...</svg> <span>Избранное</span> <span class="nav-badge">0</span>
    </div>
    <div class="tab-item" data-tab="profile">
      <svg>...</svg> <span>Профиль</span>
    </div>
  </nav>

  <!-- Экран подкатегорий (появляется поверх) -->
  <div id="nested-screen" class="hidden">
    <header>
      <button id="back-btn" onclick="goBack()">←</button>
      <h2 id="nested-title">Категория</h2>
      <button id="sort-btn">⇅</button>
    </header>
    <div id="nested-content"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
